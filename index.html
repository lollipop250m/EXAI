<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXAI — AI Conversation Exporter</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f6f6f7;
  color:#111;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:20px;
  padding:28px;
  box-shadow:0 8px 30px #0000000a;
}

h1{
  font-size:42px;
  margin:0 0 6px;
  letter-spacing:-1.5px;
}

p{
  color:#666;
}

.tag{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#eee;
  font-size:12px;
  font-weight:700;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:280px;
  border:1px solid #ccc;
  border-radius:14px;
  padding:16px;
  font:14px/1.55 system-ui;
  resize:vertical;
}

.file{
  margin-top:14px;
  padding:18px;
  border:2px dashed #ccc;
  border-radius:14px;
  text-align:center;
}

button{
  margin-top:14px;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.status{
  margin-top:12px;
  min-height:22px;
  color:#555;
}

.preview{
  display:none;
  margin-top:24px;
  border-top:1px solid #eee;
  padding-top:20px;
}

.stats{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.stat{
  background:#f1f1f2;
  padding:12px 16px;
  border-radius:12px;
}

.small{
  font-size:12px;
  color:#888;
  margin-top:18px;
}
</style>
</head>

<body>

<main class="wrap">

<div class="card">

<div class="tag">MVP • V2</div>

<h1>EXAI</h1>

<p>
Turn your AI conversations into editable Word documents.
</p>

<textarea
id="input"
placeholder="Κάνε paste εδώ μια συνομιλία από οποιοδήποτε AI…">
</textarea>

<div class="file">
  <strong>ή διάλεξε αρχείο</strong><br>
  <input id="file" type="file" accept=".txt,.md,.html,.htm">
</div>

<button id="import">Import conversation</button>

<div class="status" id="status"></div>

<div class="preview" id="preview">

<h2>Conversation detected</h2>

<div class="stats">

<div class="stat">
👤 You:
<strong id="userCount">0</strong>
</div>

<div class="stat">
🤖 AI:
<strong id="aiCount">0</strong>
</div>

<div class="stat">
💬 Total:
<strong id="totalCount">0</strong>
</div>

</div>

<button id="export" disabled>
Export to Word
</button>

</div>

<div class="small">
EXAI V2 — Η επεξεργασία γίνεται τοπικά στον browser.
</div>

</div>

</main>

<script src="app.js"></script>

</body>
                           </html>
